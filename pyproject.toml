[project]
name = "spill2source"
version = "1.0.0"
description = "Real-time oil-spill detection & vessel attribution from Sentinel-1 SAR"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.141.1",
    "folium>=0.18.0",
    "geopandas>=1.0.0",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "matplotlib>=3.9.0",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pyproj>=3.7.2",
    "pyshp>=3.1.6",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "rasterio>=1.4.4",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "shapely>=2.1.2",
    "torch>=2.14.0",
    "uvicorn>=0.54.0",
    "websockets>=17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.uv.workspace]
members = [
    "working-backend",
]
